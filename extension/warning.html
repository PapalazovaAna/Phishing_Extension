<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phishing Warning</title>
  <link rel="stylesheet" href="warning.css" />
</head>
<body>
  <main class="warning-container">
    <div class="warning-icon">!</div>

    <h1>Potential phishing website</h1>

    <p class="warning-text">
      This page was blocked because it contains
      high-risk phishing indicators.
    </p>

    <p id="blocked-url" class="blocked-url"></p>

    <div class="score-box">
      <span>Risk score</span>
      <strong id="risk-score">-</strong>
    </div>

    <h2>Detected indicators</h2>

    <ul id="indicator-list"></ul>

    <div class="actions">
      <button id="go-back-button" class="back-button">
        Go back
      </button>

      <button id="continue-button" class="continue-button">
        Continue anyway
      </button>
    </div>
  </main>

  <script src="warning.js"></script>
</body>
</html>
