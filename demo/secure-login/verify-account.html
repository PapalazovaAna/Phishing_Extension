<!doctype html>
<!--
  DEMO PAGE for testing the Phishing Risk Detector.
  "Northfield Bank" is a made-up name. The form does not send data
  anywhere: submitting is blocked by the script below.
  Serve it with:  python -m http.server 8080 --bind 127.0.0.2 --directory demo
  Open:           http://127.0.0.2:8080/secure-login/verify-account.html
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northfield Bank - Account verification</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #1f2937;
    }

    header {
      padding: 16px 24px;
      background: #0b3d91;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      max-width: 380px;
      margin: 48px auto;
      padding: 28px;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      font-size: 20px;
    }

    .warning {
      padding: 10px;
      border-radius: 6px;
      background: #fff4e5;
      color: #8a4b00;
      font-size: 13px;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 13px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      margin-top: 4px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      border: 0;
      border-radius: 6px;
      background: #0b3d91;
      color: #ffffff;
      font-weight: bold;
    }

    footer {
      margin-top: 18px;
      color: #6b7280;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>Northfield Bank</header>

  <main>
    <h1>Verify your account</h1>

    <p class="warning">
      Unusual activity was detected. Please confirm your password
      within 24 hours or your account will be suspended.
    </p>

    <form id="login-form" action="https://collect.example.net/submit" method="post">
      <label>
        Email or customer ID
        <input type="text" name="user" autocomplete="off">
      </label>

      <label>
        Password
        <input type="password" name="password" autocomplete="off">
      </label>

      <button type="submit">Verify</button>
    </form>

    <footer>Demo page for the Phishing Risk Detector, not a real bank.</footer>
  </main>

  <script>
    // Nothing is ever submitted from the demo page.
    document.getElementById("login-form").addEventListener("submit", function (event) {
      event.preventDefault();
      alert("Demo page: nothing was sent.");
    });
  </script>
</body>
</html>
